name: Tauri desktop

on:
  push:
    branches: [main, tauri-codex]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            bundle: dmg
          - name: Windows
            os: windows-2022
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - name: Test library migrations and PDF refresh in release mode
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib
      - name: Verify Windows CPU OCR installation and inference
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 20
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib real_cpu_ocr_smoke -- --ignored --nocapture
      - name: Prepare portable Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/knowledge-master.exe KnowledgeMaster-portable.exe
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $portable = "KnowledgeMaster-$version-Windows-x64-portable"
          New-Item -ItemType Directory $portable | Out-Null
          Copy-Item KnowledgeMaster-portable.exe "$portable/KnowledgeMaster.exe"
          Copy-Item docs/PORTABLE.txt "$portable/README.txt"
          Compress-Archive -Path $portable -DestinationPath "$portable.zip"
          Expand-Archive "$portable.zip" "$env:RUNNER_TEMP/portable-check"
          $expected = (Get-FileHash KnowledgeMaster-portable.exe -Algorithm SHA256).Hash
          $actual = (Get-FileHash "$env:RUNNER_TEMP/portable-check/$portable/KnowledgeMaster.exe" -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw 'Portable executable hash mismatch' }
      - name: Prepare and verify portable macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          arch=$(uname -m)
          portable="KnowledgeMaster-$version-macOS-$arch-portable"
          mkdir "$portable"
          ditto "src-tauri/target/release/bundle/macos/知屿 KnowledgeMaster.app" "$portable/知屿 KnowledgeMaster.app"
          codesign --force --deep --sign - "$portable/知屿 KnowledgeMaster.app"
          codesign --verify --deep --strict "$portable/知屿 KnowledgeMaster.app"
          cp docs/PORTABLE.txt "$portable/README.txt"
          ditto -c -k --sequesterRsrc --keepParent "$portable" "$portable.zip"
          ditto -x -k "$portable.zip" "$RUNNER_TEMP/portable-check"
          codesign --verify --deep --strict "$RUNNER_TEMP/portable-check/$portable/知屿 KnowledgeMaster.app"
      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeMaster-macOS
          if-no-files-found: error
          path: |
            KnowledgeMaster-*-macOS-*-portable.zip
            src-tauri/target/release/bundle/dmg/*.dmg
      - name: Upload Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeMaster-Windows
          if-no-files-found: error
          path: |
            KnowledgeMaster-portable.exe
            KnowledgeMaster-*-Windows-x64-portable.zip
            src-tauri/target/release/bundle/nsis/*-setup.exe

  release:
    name: Publish release packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: KnowledgeMaster-*
          path: release-artifacts
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
          find release-artifacts -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' appfile: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' appfile: data:; frame-src 'self' appfile: data:; connect-src 'none';" />
    <title>知屿</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="library-panel">
        <header class="brand">
          <div class="brand-mark">知</div>
          <div><strong>知屿</strong><span>本地知识整理器</span></div>
          <button id="settingsButton" class="icon-button" title="模型设置">⚙</button>
        </header>

        <div class="search-box">
          <span>⌕</span>
          <input id="searchInput" placeholder="搜索文件名、正文或主题" />
          <kbd>⌘K</kbd>
        </div>

        <div class="quick-actions">
          <button id="importFilesButton">＋ 导入文件</button>
          <button id="importFolderButton">导入目录</button>
        </div>

        <section class="library-section topics-section">
          <div class="section-heading">
            <span>主题视图</span>
            <button id="createTopicButton" class="text-button">＋</button>
          </div>
          <nav id="topicList" class="topic-list"></nav>
        </section>

        <section class="library-section documents-section">
          <div class="section-heading">
            <span id="documentHeading">全部资料</span>
            <small id="documentCount">0</small>
          </div>
          <div id="documentList" class="document-list"></div>
          <div id="searchResults" class="search-results hidden"></div>
        </section>

        <footer class="library-footer">
          <span id="storageStatus">本地存储</span>
          <button id="historyButton" class="text-button">对话历史</button>
        </footer>
      </aside>

      <main class="reader-panel">
        <header id="readerHeader" class="reader-header hidden">
          <div class="reader-title">
            <span id="readerType" class="file-type">DOC</span>
            <div><strong id="readerName"></strong><span id="readerMeta"></span></div>
          </div>
          <div class="reader-actions">
            <div id="pdfModeToggle" class="segmented hidden">
              <button data-mode="preview" class="active">原稿</button>
              <button data-mode="text">文本阅读</button>
            </div>
            <button id="addCurrentToScope" class="secondary-button">加入问答</button>
          </div>
        </header>

        <div id="readerTabs" class="reader-tabs hidden"></div>

        <div id="readerEmpty" class="empty-state">
          <div class="empty-illustration"><span>⌁</span></div>
          <h1>把资料放进来，开始整理</h1>
          <p>导入 PDF、HTML、Markdown 或文本文件。原文件只保存在本地 source 存储中。</p>
          <button id="emptyImportButton" class="primary-button">导入第一份资料</button>
        </div>

        <div id="readerContent" class="reader-content hidden"></div>
        <div id="selectionToolbar" class="selection-toolbar hidden">
          <button data-action="ask">✦ Ask AI</button>
          <button data-action="cite">❞ 引用</button>
          <button data-action="explain">解释</button>
        </div>
      </main>

      <aside class="chat-panel">
        <header class="chat-header">
          <div><span class="ai-dot"></span><strong>知识问答</strong></div>
          <div>
            <button id="summarizeButton" class="icon-button" title="提炼本次对话">≋</button>
            <button id="newChatButton" class="icon-button" title="新对话">＋</button>
          </div>
        </header>

        <section class="scope-area">
          <div class="scope-title"><span>问答范围</span><button id="scopeMenuButton" class="text-button">＋ 添加主题</button></div>
          <div id="scopeChips" class="scope-chips"><span class="scope-empty">未选择资料，将进行普通对话</span></div>
          <label class="current-page-toggle">
            <input id="includeCurrentPageToggle" type="checkbox" checked />
            <span>自动包含当前页面</span>
          </label>
          <div id="scopeMenu" class="scope-menu hidden"></div>
        </section>

        <div id="chatMessages" class="chat-messages">
          <div class="chat-welcome">
            <span class="welcome-icon">✦</span>
            <h2>和你的资料聊一聊</h2>
            <p>打开文档后加入问答范围，或把文件拖到主题，再选择该主题。</p>
            <div class="suggestions">
              <button>总结当前资料的核心观点</button>
              <button>列出资料中尚未解决的问题</button>
              <button>比较不同资料的结论</button>
            </div>
          </div>
        </div>

        <div id="quotePreview" class="quote-preview hidden">
          <div><span>引用原文</span><button id="removeQuote">×</button></div>
          <p id="quoteText"></p>
        </div>
        <footer class="composer">
          <textarea id="chatInput" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
          <div class="composer-footer">
            <span id="modelIndicator">尚未配置模型</span>
            <button id="sendButton" class="send-button">↑</button>
          </div>
        </footer>
      </aside>
    </div>

    <div id="settingsModal" class="modal-backdrop hidden">
      <section class="modal settings-modal">
        <header><div><span>模型连接</span><small>API Key 仅加密保存在本机</small></div><button data-close="settingsModal">×</button></header>
        <label>服务商
          <select id="providerSelect">
            <option value="deepseek">DeepSeek</option>
            <option value="glm">智谱 GLM</option>
            <option value="custom">其他 OpenAI 兼容服务</option>
          </select>
        </label>
        <label>API Base URL<input id="baseUrlInput" spellcheck="false" /></label>
        <label>模型名称<input id="modelInput" spellcheck="false" /></label>
        <label>API Key<input id="apiKeyInput" type="password" autocomplete="off" placeholder="留空则保留已保存的 Key" /></label>
        <p id="settingsHint" class="form-hint"></p>
        <div class="settings-data">
          <div><strong>知识库与 source 目录</strong><span id="dataRootText"></span><small id="librarySyncStatus"></small></div>
          <span class="settings-data-buttons">
            <button id="changeDataRootButton" class="secondary-button">更改目录</button>
            <button id="openDataButton" class="secondary-button">在 Finder 中打开</button>
          </span>
        </div>
        <footer>
          <button id="clearApiKeyButton" class="danger-text-button">清除 API Key</button>
          <button id="testSettingsButton" class="secondary-button">测试连接</button>
          <button id="saveSettingsButton" class="primary-button">保存设置</button>
        </footer>
      </section>
    </div>

    <div id="historyModal" class="modal-backdrop hidden">
      <section class="modal history-modal">
        <header><div><span>对话历史</span><small>全部对话保存在本机</small></div><button data-close="historyModal">×</button></header>
        <div id="historyList" class="history-list"></div>
      </section>
    </div>

    <div id="summaryModal" class="modal-backdrop hidden">
      <section class="modal summary-modal">
        <header><div><span id="summaryTitle">知识摘要</span><small id="summaryMeta"></small></div><button data-close="summaryModal">×</button></header>
        <div id="summaryContent" class="summary-content"></div>
      </section>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="app.js"></script>
  </body>
</html>
